        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque (ipra_ + 43 caracteres base64url)
      description: |
        Access token opaco de 15 minutos emitido por /auth/login, /auth/register o /auth/refresh.
        Solo se acepta en la cabecera Authorization; un token en la query devuelve 400.

  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'
        examples: ['1.0.0']
    AppPlatform:
      name: X-App-Platform
      in: header
      required: true
      schema:
        type: string
        enum: [android, ios]
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: UUID v4 generado por la app en la instalación (no es secreto ni identificador de hardware).
      schema:
        type: string
        format: uuid
    DeviceIdOptional:
      name: X-Device-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 1
    PerPage:
      name: perPage
      in: query
      description: Valores distintos se ajustan al permitido inmediatamente superior.
      schema:
        type: integer
        enum: [12, 24, 48]
        default: 24
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [latest, popularity, price-asc, price-desc, name]
        default: latest
    SearchQuery:
      name: q
      in: query
      required: true
      description: 1 a 120 caracteres, sin etiquetas HTML ni caracteres de control.
      schema:
        type: string
        minLength: 1
        maxLength: 120

  headers:
    X-Request-Id:
      description: Identificador de la solicitud (correlación con logs)
      schema: { type: string, format: uuid }
    Cache-Control-Public:
      description: 'Ejemplo: public, max-age=60, s-maxage=300, stale-while-revalidate=300, stale-if-error=86400'
      schema: { type: string }
    Cache-Control-NoStore:
      description: 'private, no-store'
      schema: { type: string }
    ETag:
      description: ETag débil del cuerpo
      schema: { type: string }
    Retry-After:
      description: Segundos a esperar antes de reintentar
      schema: { type: integer, minimum: 1 }
    X-IPR-Data-State:
      description: stale si se sirvió un dato vencido de la caché porque WooCommerce no respondió
      schema:
        type: string
        enum: [fresh, stale]

  responses:
    NotModified:
      description: El recurso no cambió (If-None-Match coincide)
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        ETag: { $ref: '#/components/headers/ETag' }
    UserProfileOk:
      description: Perfil del usuario
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control-NoStore' }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/UserProfile' }
    ProductPage:
      description: Página de productos
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control-Public' }
        ETag: { $ref: '#/components/headers/ETag' }
        X-IPR-Data-State: { $ref: '#/components/headers/X-IPR-Data-State' }
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
              meta: { $ref: '#/components/schemas/PageMeta' }
    BadRequest:
      description: 'Entrada inválida (validation_failed, token_in_url_forbidden)'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 'Token ausente/ inválido/ vencido/ revocado (unauthorized), credenciales inválidas (invalid_credentials) o refresh reutilizado (refresh_token_reused)'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 'Contraseña actual incorrecta (current_password_invalid) o cuenta bloqueada (account_locked)'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 'El recurso no existe o no es visible para el usuario (not_found); solo con respuesta definitiva'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 'email_in_use, refresh_in_progress o idempotency_conflict'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: 'Cuerpo mayor a 32 KB (payload_too_large)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: 'Content-Type distinto de application/json (unsupported_media_type)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UpgradeRequired:
      description: 'Versión de la app por debajo del mínimo (app_version_unsupported)'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: 'Límite de frecuencia superado (rate_limited)'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: 'Error no controlado del BFF (internal_error)'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: 'WordPress/WooCommerce/SMTP respondió de forma inesperada (upstream_bad_response). No significa que el recurso no exista.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: 'upstream_unavailable, catalog_index_warming o feature_disabled. Incluye Retry-After.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayTimeout:
      description: 'Se agotó el presupuesto de tiempo esperando a WordPress (upstream_timeout)'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details con extensiones de IPR
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Mensaje en español apto para mostrar }
        instance: { type: string }
        code:
          type: string
          x-extensible-enum: true
          examples:
            - validation_failed
            - token_in_url_forbidden
            - unauthorized
            - invalid_credentials
            - refresh_token_reused
            - current_password_invalid
            - account_locked
            - not_found
            - email_in_use
            - refresh_in_progress
            - idempotency_conflict
            - payload_too_large
            - unsupported_media_type
            - app_version_unsupported
            - rate_limited
            - internal_error
            - upstream_bad_response
            - upstream_unavailable
            - catalog_index_warming
            - feature_disabled
            - upstream_timeout
        requestId: { type: string, format: uuid }
        retryAfter: { type: integer, minimum: 1 }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [page, perPage, total, totalPages, hasMore]
      properties:
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasMore: { type: boolean }

    Slug:
      type: string
      maxLength: 200
      pattern: '^[a-z0-9][a-z0-9._-]{0,199}$'

    Price:
      type: object
      required: [status, amount, regularAmount, onSale, discountPercent, currency, taxIncluded]
      properties:
        status:
          type: string
          enum: [priced, on_request]
          description: on_request = sin precio en WooCommerce; la app muestra "Más información" (nunca $0)
        amount:
          type: [number, 'null']
          minimum: 0
          description: Precio vigente en COP, IVA incluido; null si status = on_request
        regularAmount:
          type: [number, 'null']
          minimum: 0
        onSale: { type: boolean }
        discountPercent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        currency: { type: string, const: COP }
        taxIncluded: { type: boolean, const: true }

    Availability:
      type: string
      enum: [in_stock, out_of_stock, on_backorder]
      description: Disponibilidad genérica; nunca cantidades exactas.

    ImageRef:
      type: object
      required: [url, alt]
      properties:
        url: { type: string, format: uri }
        alt: { type: string }
        width: { type: [integer, 'null'], minimum: 1 }
        height: { type: [integer, 'null'], minimum: 1 }

    BrandRef:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: [string, 'null'] }

    ProductSummary:
      type: object
      required: [id, slug, name, sku, brand, price, availability, purchasable, image, categorySlugs]
      properties:
        id: { type: integer, minimum: 1 }
        slug: { type: string }
        name: { type: string }
        sku: { type: string }
        brand:
          oneOf:
            - $ref: '#/components/schemas/BrandRef'
            - type: 'null'
        price: { $ref: '#/components/schemas/Price' }
        availability: { $ref: '#/components/schemas/Availability' }
        purchasable:
          type: boolean
          description: true solo si tiene precio y está disponible para añadir al carrito
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'
        categorySlugs:
          type: array
          items: { type: string }

    ProductAttribute:
      type: object
      required: [name, slug, options]
      properties:
        name: { type: string }
        slug: { type: string }
        options:
          type: array
          items: { type: string }

    CategoryRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [shortDescription, descriptionHtml, gallery, attributes, categories, webUrl]
          properties:
            shortDescription:
              type: string
              description: Texto plano (sin HTML)
            descriptionHtml:
              type: string
              description: HTML saneado en servidor (sin script, style, iframe, on*, ni esquemas no permitidos)
            gallery:
              type: array
              items: { $ref: '#/components/schemas/ImageRef' }
            attributes:
              type: array
              items: { $ref: '#/components/schemas/ProductAttribute' }
            categories:
              type: array
              items: { $ref: '#/components/schemas/CategoryRef' }
            webUrl: { type: string, format: uri }

    Category:
      type: object
      required: [id, slug, name, parentId, children]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        parentId: { type: [integer, 'null'] }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    FilterDimension:
      type: object
      required: [key, label, type, options]
      properties:
        key:
          type: string
          description: Nombre del parámetro de /products (p. ej. "attr[pa_capacidad-btu]", "brand", "onSale")
        label: { type: string }
        type:
          type: string
          enum: [multi, boolean]
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }

    Suggestion:
      type: object
      required: [id, slug, name, sku, brandName, price, availability, image]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        sku: { type: string }
        brandName: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Price' }
        availability: { $ref: '#/components/schemas/Availability' }
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'

    Brand:
      type: object
      required: [slug, name, logoUrl, hasLanding]
      properties:
        slug: { type: string }
        name: { type: string }
        logoUrl: { type: [string, 'null'], format: uri }
        hasLanding: { type: boolean }

    Store:
      type: object
      required: [slug, city, name, address, upcoming, phones, whatsapp, imageUrl, mapsQuery, coordinates, openingHours]
      properties:
        slug: { type: string }
        city: { type: string }
        name: { type: string }
        address: { type: string }
        upcoming: { type: boolean }
        phones:
          type: array
          items:
            type: object
            required: [type, display, dial]
            properties:
              type:
                type: string
                enum: [landline, sales_parts, sales_ac, mobile]
              display: { type: string }
              dial: { type: string, pattern: '^\+?\d{7,15}$' }
        whatsapp:
          oneOf:
            - type: object
              required: [number]
              properties:
                number: { type: string, pattern: '^\d{8,15}$' }
            - type: 'null'
        imageUrl: { type: [string, 'null'], format: uri }
        mapsQuery: { type: [string, 'null'] }
        coordinates:
          type: 'null'
          description: Fase 2 (RF-077, D-09)
        openingHours:
          type: 'null'
          description: Fase 2 (RF-077, D-09)

    AppConfig:
      type: object
      required: [minSupportedVersion, recommendedVersion, features, contact, legal, notices, checkout, catalog]
      properties:
        minSupportedVersion: { $ref: '#/components/schemas/PlatformVersions' }
        recommendedVersion: { $ref: '#/components/schemas/PlatformVersions' }
        features:
          type: object
          required: [checkoutEnabled, pqrsEnabled, btuCalculatorEnabled]
          properties:
            checkoutEnabled: { type: boolean }
            pqrsEnabled: { type: boolean }
            btuCalculatorEnabled: { type: boolean }
        contact:
          type: object
          required: [whatsapp, phone, salesEmail, pqrsEmail, engineering]
          properties:
            whatsapp:
              type: object
              required: [number, defaultMessage]
              properties:
                number: { type: string }
                defaultMessage: { type: string }
            phone:
              type: object
              required: [display, dial]
              properties:
                display: { type: string }
                dial: { type: string }
            salesEmail: { type: string, format: email }
            pqrsEmail: { type: string, format: email }
            engineering:
              type: object
              required: [whatsapp, email]
              properties:
                whatsapp: { type: [string, 'null'] }
                email: { type: [string, 'null'], format: email }
        legal:
          type: object
          required: [terms, privacyPolicy, dataRightsChannel, accountDeletionNotice]
          properties:
            terms: { $ref: '#/components/schemas/LegalDocument' }
            privacyPolicy: { $ref: '#/components/schemas/LegalDocument' }
            dataRightsChannel:
              type: object
              required: [url, email]
              properties:
                url: { type: [string, 'null'], format: uri }
                email: { type: [string, 'null'], format: email }
            accountDeletionNotice:
              type: string
              description: Qué se elimina y qué se conserva (pendiente D-12)
        notices:
          type: object
          required: [shipping, warranty, priceOnRequest]
          properties:
            shipping: { type: string }
            warranty: { type: string }
            priceOnRequest: { type: string }
        checkout:
          type: object
          required: [allowedHosts, returnPathPrefix]
          properties:
            allowedHosts:
              type: array
              items: { type: string }
            returnPathPrefix: { type: string }
        catalog:
          type: object
          required: [pageSizes, maxPage]
          properties:
            pageSizes:
              type: array
              items: { type: integer }
            maxPage: { type: integer }

    PlatformVersions:
      type: object
      required: [android, ios]
      properties:
        android: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        ios: { type: string, pattern: '^\d+\.\d+\.\d+$' }

    LegalDocument:
      type: object
      required: [version, url]
      properties:
        version: { type: string }
        url: { type: string, format: uri }

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, firstName, lastName, password, acceptance]
      properties:
        email: { type: string, format: email, maxLength: 120 }
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        password: { type: string, minLength: 8, maxLength: 128 }
        acceptance:
          type: object
          additionalProperties: false
          required: [termsVersion, privacyPolicyVersion, accepted]
          properties:
            termsVersion: { type: string, maxLength: 20 }
            privacyPolicyVersion: { type: string, maxLength: 20 }
            accepted: { type: boolean, const: true }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 120
          description: Correo o nombre de usuario
        password: { type: string, minLength: 1, maxLength: 128 }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, pattern: '^iprr_[A-Za-z0-9_-]{43}$' }

    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [current, all]
          default: current

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 120 }

    AcceptedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, const: accepted }

    Session:
      type: object
      required: [accessToken, accessTokenExpiresIn, refreshToken, refreshTokenExpiresAt, tokenType, sessionId]
      properties:
        accessToken: { type: string, pattern: '^ipra_[A-Za-z0-9_-]{43}$' }
        accessTokenExpiresIn:
          type: integer
          description: Segundos de vida del access token (propuesto 900)
        refreshToken: { type: string, pattern: '^iprr_[A-Za-z0-9_-]{43}$' }
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Vencimiento por inactividad (acotado por la vida absoluta de la sesión)
        tokenType: { type: string, const: Bearer }
        sessionId: { type: string, format: uuid }

    AuthSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [session, user]
          properties:
            session: { $ref: '#/components/schemas/Session' }
            user: { $ref: '#/components/schemas/UserProfile' }

    UserProfile:
      type: object
      required: [id, email, firstName, lastName, displayName, billing, shipping]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        displayName: { type: string }
        billing:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
        shipping:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'

    Address:
      type: object
      required: [firstName, lastName, company, nationalId, address1, address2, department, city, postcode, phone]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        company: { type: string }
        nationalId:
          type: [string, 'null']
          description: Cédula o NIT (clave de almacenamiento en el perfil por confirmar)
        address1: { type: string }
        address2: { type: string }
        department: { type: string, description: Código de departamento de WooCommerce (p. ej. ANT, BOG) }
        city: { type: string }
        postcode: { type: string }
        phone: { type: [string, 'null'] }

    AddressInput:
      type: object
      additionalProperties: false
      required: [firstName, lastName, address1, department, city]
      properties:
        nationalId: { type: string, minLength: 3, maxLength: 30, pattern: '^[\d.\-]+$' }
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        company: { type: string, maxLength: 120 }
        address1: { type: string, minLength: 1, maxLength: 200 }
        address2: { type: string, maxLength: 200 }
        department: { type: string, minLength: 1, maxLength: 3 }
        city: { type: string, minLength: 1, maxLength: 80 }
        postcode: { type: string, maxLength: 20 }
        phone: { type: string, minLength: 7, maxLength: 20, pattern: '^[\d\s+\-().]{7,20}$' }

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }

    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required: [newEmail, currentPassword]
      properties:
        newEmail: { type: string, format: email, maxLength: 120 }
        currentPassword: { type: string, minLength: 1, maxLength: 128 }

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }

    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, confirm]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        confirm: { type: boolean, const: true }

    AccountDeletionStatus:
      type: object
      required: [requestId, status, completeBy]
      properties:
        requestId: { type: string, format: uuid }
        status:
          type: string
          enum: [scheduled, completed]
        completeBy: { type: string, format: date-time }

    CartItem:
      type: object
      additionalProperties: false
      required: [id, quantity]
      properties:
        id: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 99 }

    CartItemsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CartItem' }

    CartValidation:
      type: object
      required: [lines, informativeSubtotal, checkoutAllowed]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [id, quantity, status, product, lineSubtotal]
            properties:
              id: { type: integer }
              quantity: { type: integer }
              status:
                type: string
                enum: [available, out_of_stock, on_backorder, price_on_request, not_found]
              product:
                oneOf:
                  - $ref: '#/components/schemas/ProductSummary'
                  - type: 'null'
              lineSubtotal: { type: [number, 'null'] }
        informativeSubtotal:
          type: object
          required: [amount, currency, taxIncluded]
          properties:
            amount: { type: number, minimum: 0 }
            currency: { type: string, const: COP }
            taxIncluded: { type: boolean, const: true }
        checkoutAllowed: { type: boolean }

    CheckoutSession:
      type: object
      required: [checkoutRef, checkoutUrl, expiresAt, expiresIn, allowedHosts, returnUrlPrefix]
      properties:
        checkoutRef: { type: string, format: uuid }
        checkoutUrl:
          type: string
          format: uri
          description: URL con ticket opaco de 32 caracteres; no se guarda ni se registra en la app
        expiresAt: { type: string, format: date-time }
        expiresIn: { type: integer, const: 60 }
        allowedHosts:
          type: array
          items: { type: string }
        returnUrlPrefix: { type: string, format: uri }

    PaymentState:
      type: string
      enum: [paid, pending, failed, cancelled, refunded, unknown]

    OrderSummary:
      type: object
      required: [id, number, status, statusLabel, paymentState, createdAt, currency, total, itemCount]
      properties:
        id: { type: integer }
        number: { type: string }
        status:
          type: string
          description: Estado de WooCommerce sin prefijo wc- (p. ej. processing)
        statusLabel: { type: string }
        paymentState: { $ref: '#/components/schemas/PaymentState' }
        createdAt: { type: string, format: date-time }
        currency: { type: string }
        total: { type: number }
        itemCount: { type: integer, minimum: 0 }

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [subtotal, shippingTotal, discountTotal, taxTotal, paymentMethodTitle, items]
          properties:
            subtotal: { type: number }
            shippingTotal: { type: number }
            discountTotal: { type: number }
            taxTotal: { type: number }
            paymentMethodTitle: { type: string }
            items:
              type: array
              items:
                type: object
                required: [productId, name, sku, quantity, total, imageUrl]
                properties:
                  productId: { type: [integer, 'null'] }
                  name: { type: string }
                  sku: { type: [string, 'null'] }
                  quantity: { type: integer }
                  total: { type: number }
                  imageUrl: { type: [string, 'null'], format: uri }

    CheckoutStatus:
      type: object
      required: [checkoutRef, state, order]
      properties:
        checkoutRef: { type: string, format: uuid }
        state:
          type: string
          enum: [awaiting_order, order_created]
        order:
          oneOf:
            - $ref: '#/components/schemas/OrderSummary'
            - type: 'null'

    PqrsRequest:
      type: object
      additionalProperties: false
      required: [type, name, email, phone, message, acceptsDataPolicy]
      properties:
        type:
          type: string
          enum: [peticion, queja, reclamo, sugerencia]
        name: { type: string, minLength: 3, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, pattern: '^[\d\s+\-().]{7,20}$' }
        orderReference: { type: string, maxLength: 60 }
        message: { type: string, minLength: 1, maxLength: 1000 }
        acceptsDataPolicy: { type: boolean, const: true }
