name: ipr_mobile
description: "App móvil de IPR Partes y Repuestos (Inverprimos S.A.S.)."
publish_to: 'none'

# Versión semántica; el número de build lo asigna el flujo de release (docs/09_devops).
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  # Caché de imágenes con tope en disco (ADR-007).
  cached_network_image: ^4.0.7
  # Red (ADR-006).
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Estado y DI (ADR-004). Sin riverpod_generator.
  flutter_riverpod: ^3.5.0
  # Almacenamiento (ADR-007).
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html_core: ^0.17.4
  # Modelos y serialización.
  freezed_annotation: ^3.1.0
  # Navegación (ADR-005).
  go_router: ^18.1.4
  hive_ce: ^2.23.3
  intl: 0.20.3
  json_annotation: ^4.12.0
  # Material se publica como paquete desde Flutter 3.47: `package:flutter/
  # material.dart` está deprecado en 3.50 (hallazgo de M0).
  material_ui: ^1.1.0
  # Anotación @immutable para los tipos de valor puros de shared/domain.
  meta: ^1.16.0
  package_info_plus: ^10.2.2
  # Ubicar el directorio de Hive (no figuraba en la lista: ver informe M0).
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  alchemist: ^0.15.0
  build_runner: ^2.17.1
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  # BFF simulado local (tool/mock_bff).
  shelf: ^1.4.3
  very_good_analysis: ^11.0.0
  # Lee openapi.yaml en el BFF simulado y en la validación de fixtures.
  yaml: ^3.1.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/map/
    - assets/licenses/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
